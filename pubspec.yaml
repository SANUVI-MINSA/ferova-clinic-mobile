name: ferova_clinic_flutter
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  get_it: ^8.0.2
  flutter_bloc: ^9.1.1
  printing: ^5.13.4
  geolocator: ^13.0.1
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.3"

flutter:
  uses-material-design: true
  assets:
    - assets/ferova_clinic.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/ferova_clinic.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/ferova_clinic.png"
